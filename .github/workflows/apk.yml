name: Build APK

# Manually triggered: produces an installable Android APK pointed at a backend.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL the app should call"
        required: true
        default: "https://jcred-demo.onrender.com/api/v1"

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE=${{ inputs.api_base }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcred-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
